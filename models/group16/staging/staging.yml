version: 2

models:
  - name: stg_nyc_collisions
    description: NYC collisions dated January 1, 2021 through June 30, 2026. One row per collision_id (duplicates from the raw load removed). Missing persons injured/killed counts stay null.
    columns:
      - name: collision_id
        data_tests:
          - unique
          - not_null
      - name: crash_date
        data_tests:
          - not_null
      - name: severity_key
        data_tests:
          - not_null
      - name: loaded_at_utc
        description: Time the row was loaded into the warehouse by dbt (UTC). The raw tables have no load timestamp column.

  - name: stg_nyc_311_requests
    description: Street Light Condition and Traffic Signal Condition requests created January 1, 2021 through June 30, 2026. One row per unique_key (duplicates removed). Closed date and resolution hours are only kept for Closed requests.
    columns:
      - name: unique_key
        description: Source ID converted to INT64 to match our dimensional model.
        data_tests:
          - unique
          - not_null
      - name: raw_unique_key
        description: Original source ID text, kept for tracing.
      - name: created_datetime
        data_tests:
          - not_null
      - name: complaint_type
        data_tests:
          - not_null
      - name: loaded_at_utc
        description: Time the row was loaded into the warehouse by dbt (UTC). The raw tables have no load timestamp column.